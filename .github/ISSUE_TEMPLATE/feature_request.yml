name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景
      description: 说明为什么需要这个功能。
      placeholder: 例如：希望月底能把所有工人的工时导出给财务。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他说明
      description: 可填写截图、参考产品或补充信息。
