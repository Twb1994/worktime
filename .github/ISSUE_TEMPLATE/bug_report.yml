name: Bug 反馈
description: 反馈小程序运行中的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 简要说明哪里不正常。
      placeholder: 例如：统计页导出 CSV 后没有提示。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出如何复现。
      placeholder: |
        1. 打开统计页
        2. 选择某个月份
        3. 点击导出 CSV
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 应该看到什么结果？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么？
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: 微信开发者工具版本 / 手机系统 / 基础库版本
