name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON files
        run: |
          node -e "for (const file of ['app.json','project.config.json','sitemap.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          find pages -name "*.js" -print0 | xargs -0 -n1 node --check
          find utils -name "*.js" -print0 | xargs -0 -n1 node --check
